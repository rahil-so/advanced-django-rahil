<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


    <script>
        const socket = new WebSocket(
            "ws://localhost:8000/ws/chat/"
        )
        socket.onopen = function() {
            console.log("Connected")
            socket.send(
                JSON.stringify({
                    message: "Hello Django"
                })
            )
        }

        socket.onmessage = function(event)
        {
            console.log(event.data)
        }
    </script>
</body>
</html>
